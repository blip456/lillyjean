name: CI

on:
  pull_request:
    # "edited" re-checks the PR title after it is renamed (it becomes the squash commit).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway local Supabase (Docker) with only the services the checks need.
      - name: Start local Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations from scratch
        run: pnpm exec supabase db reset
      - name: Lint the database schema
        run: pnpm exec supabase db lint --local --fail-on error
      - name: Run database tests
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            pnpm exec supabase test db
          else
            echo "No database tests yet."
          fi
      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/database.types.ts
          if compgen -G "supabase/migrations/*.sql" > /dev/null; then
            diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts || {
              echo "::error::src/lib/supabase/database.types.ts is out of date. Run 'pnpm db:types' and commit the result."
              exit 1
            }
          else
            echo "No migrations yet; skipping the types check."
          fi

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint PR title (becomes the squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose
