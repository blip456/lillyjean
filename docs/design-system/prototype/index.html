<title>Lillyjean · design explorations (static prototype)</title>
<!--
  Lillyjean · design explorations — a non-clickable, high-fidelity static prototype.
  14 screens from wireframes v2 (docs/wireframes/v2) in 6 active visual designs
  (Lillyjean — the chosen direction —, iOS Glass, iOS Night, iOS Vibrant,
  Media dark, Soft & tactile) plus 4 archived ones from the first round
  (Material 3, Editorial, Scandinavian, Paper).
  Self-contained: inline CSS + JS, no network requests, system fonts only.
  Lillyjean previews the real design tokens: the block between @tokens:begin
  and @tokens:end is written by `pnpm tokens:build` from design/tokens (see
  DESIGN.md at the repo root). The other designs are exploration only.

  Structure of this file
    CSS  · shell (toolbar, grid, notes) and phone structure, shared component layout
         · the iOS family block [data-fam="ios"] shared by ios|night|vivid, then
           one block per design, scoped under [data-design="…"]
           (active: lj, ios, night, vivid, media, clay · archived: m3, ed, sc, pp)
    JS   1. sample data (defined once)   2. components (u-* markup vocabulary)
         3. screens (written once)       4. designs (notes + small markup overrides)
         5. icon sprite                  6. shell (switcher, views, persistence)
-->

/* =====================================================================

.scr {

.ic {

/* covers (same artwork in every design; designs only change shape and shadow) */
.cover {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  justify-content: space-between;
  flex: none;
  width: var(--w);
  height: var(--h);
  padding: calc(var(--w) * 0.1) calc(var(--w) * 0.1) calc(var(--w) * 0.09) calc(var(--w) * 0.13);
  overflow: hidden;
  border-radius: var(--cv-r, 3px);
  background: var(--cb);
  color: var(--cf);
  box-shadow: var(--cv-sh, 0 1px 2px rgba(0, 0, 0, 0.18), 0 3px 8px rgba(0, 0, 0, 0.08));
  font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif;
  letter-spacing: 0;
  text-align: left;
}
.cover::before,
.cover::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.cover::after {
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.22), rgba(255, 255, 255, 0.1) 4%, transparent 9%);
}
.cv-t {
  position: relative;
  z-index: 1;
  font-size: calc(var(--w) * var(--fs, 0.135));
  line-height: 1.08;
  font-weight: 700;
  overflow-wrap: break-word;
  hyphens: auto;
}
.cv-a {
  position: relative;
  z-index: 1;
  font-size: calc(var(--w) * 0.075);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.92;
}
.cv-band::before {
  background: linear-gradient(transparent 56%, var(--ca) 56% 70%, transparent 70%);
}
.cv-circle::before {
  background: radial-gradient(circle at 68% 62%, var(--ca) 0 24%, transparent 24.6%);
}
.cv-stripe::before {
  background: linear-gradient(90deg, transparent 0 74%, var(--ca) 74% 84%, transparent 84% 88%, var(--ca) 88% 90%, transparent 90%);
}
.cv-frame::before {
  inset: calc(var(--w) * 0.07);
  border: calc(var(--w) * 0.025 + 0.5px) solid var(--ca);
}
.cv-split::before {
  background: linear-gradient(160deg, transparent 58%, var(--ca) 58.4%);
}
.cv-dots::before {
  top: 48%;
  background: radial-gradient(var(--ca) 22%, transparent 25%) 0 0 / calc(var(--w) * 0.2) calc(var(--w) * 0.2);
}
.cv-waves::before {
  top: 50%;
  background: repeating-linear-gradient(172deg, transparent 0 9px, var(--ca) 9px 12px);
  opacity: 0.9;
}
.u-mosaic {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  flex: none;
  width: var(--s);
  height: var(--s);
  overflow: hidden;
  border-radius: var(--mo-r, 10px);
  box-shadow: var(--mo-sh, none);
}
.u-mosaic .cover {
  width: 100%;
  height: 100%;
  border-radius: 0;
  box-shadow: none;
}

/* =====================================================================
   iOS FAMILY · shared structure for designs 2–4 (iOS Glass, iOS Night,
   iOS Vibrant). Scoped under [data-fam="ios"]; every colour is a token
   so each design only sets its palette and a few structural overrides.
   ===================================================================== */
[data-fam='ios'] .scr {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', Inter, system-ui, sans-serif;
  --rounded: ui-rounded, 'SF Pro Rounded', -apple-system, Inter, system-ui, sans-serif;
  --cv-r: 4px;
  --mo-r: 18px;
  --px: 16px;
  font-size: 17px;
  letter-spacing: -0.015em;
}
[data-fam='ios'] .scr-bg {
  background: var(--wash), var(--bg);
}

/* --- Liquid Glass material (tab bar, nav buttons, sheets) --- */

/* =====================================================================
   DESIGN 5 · Media dark — a social media app for books (Letterboxd /
   Spotify): charcoal, cover-first shelves, dense rows, heavy sans,
   one vivid green accent, friend activity on avatars and covers.
   ===================================================================== */
[data-design='media'] .scr {
  --font: 'Helvetica Neue', Helvetica, Inter, 'Segoe UI', Roboto, Arial, sans-serif;
  --bg: #121314;
  --card: #1d1f21;
  --card2: #282b2e;
  --fg: #f4f4f5;
  --fg2: #d7d9db;
  --muted: #9ba1a7;
  --line: rgba(255, 255, 255, 0.09);
  --track: #34383c;
  --accent: #2ee07a;
  --on-accent: #04170b;
  --ok: #2ee07a;
  --flag: #2ee07a;
  --star: #2ee07a;
  --star-off: #3b3f43;
  --av1: #2ee07a;
  --av2: #ff9466;
  --av3: #ffd166;
  --av4: #67c7ff;
  --av5: #ff8fbf;
  --cv-r: 3px;
  --mo-r: 4px;
  --cv-sh: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 6px 14px -6px rgba(0, 0, 0, 0.9);
  --sb: #fff;
  --hi: #fff;
  --icw: 2.1;
  font-size: 15px;
  letter-spacing: -0.005em;
  color-scheme: dark;
}

  --card-shadow: 0 1px 2px 0 rgb(15 63 61 / 6%), 0 8px 24px -12px rgb(15 63 61 / 12%);
  --sheet-shadow: 0 -8px 30px -10px rgb(15 63 61 / 18%);
  --gradient-page: radial-gradient(75% 34% at 4% 2%, #fbe3e8 0%, transparent 70%), radial-gradient(60% 32% at 100% 14%, #d4efed 0%, transparent 70%), radial-gradient(80% 40% at 20% 100%, #ebf6f5 0%, transparent 70%), radial-gradient(60% 30% at 100% 92%, #fbe3e8 0%, transparent 70%), #f3f8f7;
  --gradient-avatar-ring: conic-gradient(from 0deg, #5cbdb9 0%, #f09bb0 50%, #5cbdb9 100%);
}
/* @tokens:end */
/* =====================================================================
   DESIGN 1 · Lillyjean (chosen direction) — Media dark's layout and
   component language (cover shelves, dense rows, fanned readlists,
   friend activity, flat tab bar with a + key, pill badges) in light
   mode with the iOS Glass palette and page gradient. Every colour, the
   type ramp, radii and shadows come from the generated token block
   above (design/tokens → pnpm tokens:build); no raw colours here.

  --ok: var(--link);

  --star: var(--rating);
  --star-off: var(--rating-empty);
  --av1: var(--avatar-1);
  --av2: var(--avatar-2);
  --av3: var(--avatar-3);
  --av4: var(--avatar-4);
  --av5: var(--avatar-5);
  --gone: var(--muted);
  --cv-r: var(--radius-cover);
  --mo-r: var(--radius-cover);
  --cv-sh: var(--cover-shadow);
  --sb: var(--foreground);
  --hi: var(--foreground);

}

}

/* =====================================================================
   DESIGN 6 · Soft & tactile — claymorphism: chunky rounded shapes,
   soft outer and inner shadows, peach / butter / sage on warm cream,
   a rounded typeface, wells you could press a finger into and a
   floating pill nav.
   ===================================================================== */
[data-design='clay'] .scr {
  --font: ui-rounded, 'SF Pro Rounded', Nunito, Quicksand, 'Varela Round', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --bg: #fbefe4;
  --card: #fff8f1;
  --peach: #ffd3b8;
  --butter: #ffe79a;
  --sage: #bcd6b0;
  --fg: #3b2a22;
  --fg2: #4a382f;
  --muted: #76594a;
  --line: rgba(59, 42, 34, 0.1);
  --track: #f1dccb;
  --accent: #f0946a;
  --tint: #2f6a3a;
  --ok: #2f6a3a;
  --flag: #9a3b20;
  --star: #f0a23a;
  --star-off: #ead6c6;
  --av1: #bcd6b0;
  --av2: #ffc7a6;
  --av3: #ffe08a;
  --av4: #b7d8e8;
  --av5: #f6c1c9;
  --cv-r: 9px;
  --mo-r: 24px;
  --cv-sh: 0 8px 14px -6px rgba(140, 80, 40, 0.45);
  --clay: 0 12px 22px -10px rgba(170, 100, 60, 0.4), 0 2px 4px rgba(170, 100, 60, 0.1), inset 0 -5px 10px rgba(170, 100, 60, 0.12), inset 0 4px 6px rgba(255, 255, 255, 0.9);
  --clay-s: 0 6px 12px -6px rgba(170, 100, 60, 0.45), inset 0 -3px 6px rgba(170, 100, 60, 0.14), inset 0 3px 4px rgba(255, 255, 255, 0.85);
  --well: inset 0 4px 8px rgba(170, 100, 60, 0.2), inset 0 -2px 3px rgba(255, 255, 255, 0.9);
  --icw: 2.3;
  font-size: 16px;
  letter-spacing: 0;
}
[data-design='clay'] .scr-bg {
  background:
    radial-gradient(40% 20% at 100% 8%, rgba(255, 211, 184, 0.9), transparent 70%),
    radial-gradient(45% 22% at 0% 60%, rgba(188, 214, 176, 0.55), transparent 70%),
    radial-gradient(45% 20% at 100% 96%, rgba(255, 231, 154, 0.7), transparent 70%),
    var(--bg);
}
[data-design='clay'] .u-av {
  color: var(--fg);
  font-weight: 800;
  box-shadow: inset 0 -3px 5px rgba(120, 70, 40, 0.15), inset 0 3px 4px rgba(255, 255, 255, 0.7);
}
[data-design='clay'] .u-av--s {
  box-shadow: 0 0 0 2.5px var(--avring, var(--card));
}

/* app bar: chunky round buttons */
[data-design='clay'] .u-appbar {
  padding: 0 16px;
}
[data-design='clay'] .u-ab-row {
  min-height: 56px;
}
[data-design='clay'] .u-iconbtn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--fg);
  background: var(--card);
  box-shadow: var(--clay-s);
}
[data-design='clay'] .u-ab-title {
  font-weight: 800;
}
[data-design='clay'] .u-largetitle,
[data-design='clay'] .u-h1,
[data-design='clay'] .u-hello,
[data-design='clay'] .u-display {
  font-weight: 800;
  letter-spacing: -0.02em;
}

}

/* sections */
[data-design='clay'] .u-sec {

  align-items: center;
}

[data-design='clay'] .u-btn {

  <div class="tb-title"><b>Lillyjean</b> <span>· design explorations</span></div>
  <button type="button" class="tb-btn tb-notes-m" data-notes-toggle aria-pressed="true" aria-controls="notes">Notes</button>
  <div class="tb-group" id="design-bar" role="group" aria-label="Design (keys 1–5)"></div>
  <div class="tb-arch">
    <button type="button" class="tb-arch-btn" id="arch-btn" aria-expanded="false" aria-controls="arch-menu"><span class="l-long">Archived</span><span class="l-short">Archive</span><span class="tb-arch-cur" id="arch-cur"></span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="tb-arch-menu" id="arch-menu" hidden>
      <p class="tb-arch-note">First-round directions, kept for reference. The iOS direction was preferred.</p>
      <div class="tb-arch-list" id="arch-list" role="group" aria-label="Archived designs"></div>
    </div>
  </div>
  <div class="tb-group tb-view" role="group" aria-label="View">
    <button type="button" data-set-view="grid" aria-pressed="true"><span class="l-long">All screens</span><span class="l-short">All</span></button>
    <button type="button" data-set-view="one" aria-pressed="false"><span class="l-long">One screen</span><span class="l-short">One</span></button>
  </div>
  <div class="tb-screen">
    <button type="button" class="tb-btn" id="prev" aria-label="Previous screen">&#8592;</button>
    <label class="sr" for="screen-select">Screen</label>
    <select id="screen-select"></select>
    <button type="button" class="tb-btn" id="next" aria-label="Next screen">&#8594;</button>
  </div>
  <button type="button" class="tb-btn tb-notes" id="notes-toggle" data-notes-toggle aria-pressed="true" aria-controls="notes">Design notes</button>
</header>
<main>
  <section class="notes" id="notes" aria-label="Design notes"></section>
  <div class="stage" id="stage" data-design="ios"></div>
</main>
<script>
"use strict";
/* =====================================================================
   1. Sample data — defined once, shared by every design.
   Neutral sample content: classics and invented titles, friends Jean,
   Lilly, Sam, Mira. Covers are generated with CSS from cv = [background,
   foreground, accent, pattern].
   ===================================================================== */
const ME = { u: 'noor', ini: 'N', av: 1, since: 'March 2026' };
const USERS = {
  jean: { u: 'jean', ini: 'J', av: 2 },
  lilly: { u: 'lilly', ini: 'L', av: 3 },
  sam: { u: 'sam', ini: 'S', av: 4 },
  mira: { u: 'mira', ini: 'M', av: 5 },
  ada: { u: 'ada.v', ini: 'A', av: 3 },
  tom: { u: 'tom_reads', ini: 'T', av: 5 },
  gone: { gone: true },
};

const BOOKS = {
  frankenstein: { t: 'Frankenstein', a: 'Mary Shelley', s: 'reading', p: 40, flag: 1, cv: ['#22304A', '#F1E9D2', '#D2553A', 'circle'] },
  middlemarch: { t: 'Middlemarch', a: 'George Eliot', s: 'reading', flag: 1, cv: ['#5F8A6E', '#FFF8E7', '#E9C46A', 'band'] },
  lighthouse: { t: 'The Lighthouse Keeper’s Almanac', a: 'Ines Vermeulen', s: 'reading', cv: ['#E9B949', '#1E2B3A', '#2E6F8E', 'waves'] },
  anna: { t: 'Anna Karenina', a: 'Leo Tolstoy', s: 'want', cv: ['#8E2C3A', '#FCEFD9', '#E8B04B', 'frame'] },
  warpeace: { t: 'War and Peace', a: 'Leo Tolstoy', s: 'want', cv: ['#2D4F3C', '#F4E8C8', '#C7A14A', 'frame'] },
  karamazov: { t: 'The Brothers Karamazov', a: 'Fyodor Dostoevsky', s: 'read', cv: ['#33454F', '#F2E6D8', '#D9875B', 'split'] },
  bleak: { t: 'Bleak House', a: 'Charles Dickens', s: 'want', cv: ['#5B6770', '#F4F1EA', '#A9C4D6', 'dots'] },
  persuasion: { t: 'Persuasion', a: 'Jane Austen', s: 'want', flag: 1, cv: ['#F2C6B4', '#4A2635', '#B65C6E', 'circle'] },
  moby: { t: 'Moby-Dick', a: 'Herman Melville', s: 'want', cv: ['#1D5E7A', '#F7F1E3', '#9FD3E0', 'waves'] },
  dracula: { t: 'Dracula', a: 'Bram Stoker', cv: ['#141414', '#EFE6D6', '#B3122E', 'band'] },
  carmilla: { t: 'Carmilla', a: 'J. Sheridan Le Fanu', cv: ['#6E2B4F', '#F6E3EC', '#E3A0C0', 'circle'] },
  otranto: { t: 'The Castle of Otranto', a: 'Horace Walpole', cv: ['#7A6A55', '#F7EFE1', '#2B2219', 'frame'] },
  turn: { t: 'The Turn of the Screw', a: 'Henry James', cv: ['#C9D3CF', '#23302E', '#5C7A73', 'stripe'] },
  womanwhite: { t: 'The Woman in White', a: 'Wilkie Collins', cv: ['#EDEAE3', '#2A2A2A', '#9AA5B1', 'split'] },
  littlewomen: { t: 'Little Women', a: 'Louisa May Alcott', cv: ['#C96F4A', '#FFF4E6', '#F2D7A6', 'dots'] },
  annegg: { t: 'Anne of Green Gables', a: 'L. M. Montgomery', cv: ['#5E8C4A', '#FFF6E0', '#E0794A', 'band'] },
  secretgarden: { t: 'The Secret Garden', a: 'Frances Hodgson Burnett', cv: ['#3F6B4A', '#F3EBD3', '#E6A1A8', 'dots'] },
  saltsaffron: { t: 'Salt and Saffron', a: 'Maren Holt', cv: ['#E07A3F', '#2B1A10', '#F6D27A', 'circle'] },
  smallrooms: { t: 'A Year of Small Rooms', a: 'Tobi Okafor', cv: ['#9BB7D4', '#1D2A3A', '#F3E3C3', 'frame'] },
  seaglass: { t: 'The Sea-Glass Collector', a: 'Ada Lindqvist', cv: ['#7CC6C0', '#12343A', '#F7F3E8', 'waves'] },
  treasure: { t: 'Treasure Island', a: 'Robert Louis Stevenson', cv: ['#B8432F', '#FFF1DA', '#2B2B2B', 'stripe'] },
  leagues: { t: 'Twenty Thousand Leagues Under the Seas', a: 'Jules Verne', cv: ['#14324A', '#E5F1F5', '#3FA7B5', 'waves'] },
  lastman: { t: 'The Last Man', a: 'Mary Shelley', cv: ['#4A4E57', '#EDE7DB', '#C49A6C', 'band'] },
  mathilda: { t: 'Mathilda', a: 'Mary Shelley', s: 'want', flag: 1, cv: ['#A5577A', '#FFF0F5', '#F4C7D9', 'frame'] },
  poems: { t: 'Selected Poems', a: 'Percy Bysshe Shelley', s: 'read', cv: ['#E9E1CF', '#2C2A26', '#7D8C5A', 'split'] },
};

const CHALLENGES = {
  c600: { type: 'personal', t: 'A classic over 600 pages', when: 'Ends in 12 days', since: 'Started 1 September', pick: 'middlemarch' },
  gothic: {
    type: 'shared', t: 'Gothic October', when: 'Ends in 20 days', pick: 'frankenstein',
    friends: ['jean', 'lilly', 'sam', 'gone'], done: '2 of 4 friends done',
  },
  sea: { type: 'shared', t: 'A book set at sea', when: 'Ends in 34 days', pick: null, friends: ['jean', 'lilly', 'sam', 'mira'], done: '2 of 4 friends done' },
  off: { type: 'official', t: 'Read a book written before 1900', when: 'No end date', pick: 'persuasion', finished: '128 readers finished' },
  poetry: { type: 'personal', t: 'Winter poetry', when: 'Starts 1 December', sub: 'Starts in 51 days' },
};
const CH_LABEL = { personal: 'Personal', shared: 'Shared with friends', official: 'Official' };

const READLISTS = {
  winter: { t: 'Long winter novels', books: ['middlemarch', 'anna', 'karamazov', 'warpeace', 'bleak'], n: 5, share: 'Shared with 2 friends', with: ['jean', 'sam'] },
  cosy: { t: 'Cosy autumn reads', books: ['lighthouse', 'saltsaffron', 'smallrooms', 'persuasion'], n: 8, share: 'Only me' },
  water: { t: 'Summer by the water', books: ['moby', 'seaglass', 'leagues', 'treasure'], n: 6, share: 'Only me' },
  gothicshelf: { t: 'Gothic shelf', books: ['dracula', 'carmilla', 'otranto', 'turn'], n: 9, by: 'jean', access: 'Can edit' },
  comfort: { t: 'Comfort reads', books: ['littlewomen', 'annegg', 'secretgarden', 'persuasion'], n: 7, by: 'lilly', access: 'View only' },
};

const STATUS_LABEL = { want: 'Want to read', reading: 'Reading', read: 'Read' };

/* Screens covered, in prototype order. */
const SCREENS = [
  ['A2', 'Welcome'],
  ['A3', 'Sign up'],
  ['A9', 'Onboarding 1 · Library card'],
  ['B1', 'Home'],
  ['B3', 'Status sheet'],
  ['N2', '+ menu'],
  ['D1', 'Book search'],
  ['D2', 'Book detail'],
  ['C1', 'Readlists overview'],
  ['C2', 'Readlist detail'],
  ['E1', 'Challenges · Active'],
  ['E4', 'Challenge detail'],
  ['F1', 'Friends tab'],
  ['G1', 'Profile'],
];
/* =====================================================================
   2. Components. One shared markup vocabulary (u-*). Each design styles
   it under [data-design="…"] and may override single components in
   DESIGNS[key].ui when the structure itself has to differ.
   Nothing here is interactive: plain <div>/<span>, no links or buttons.
   ===================================================================== */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const UI = {
  /* ---------- chrome ---------- */
  statusbar() {
    return `<div class="u-sbar"><span class="u-sb-time">9:41</span><span class="u-island"></span><span class="u-sb-icons">
<svg viewBox="0 0 18 12" width="18" height="12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
<svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .8C5.2.8 2.7 1.9.8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4.4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 1 .2 1.3.5L8 11.6 6.7 10.2c.3-.3.8-.5 1.3-.5Z"/></svg>
<svg viewBox="0 0 27 12" width="27" height="12" aria-hidden="true"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="8" rx="2"/><path d="M25 4v4c.8-.3 1.3-1.1 1.3-2S25.8 4.3 25 4Z" opacity=".45"/></svg></span></div>`;
  },
  screen({ body, tab = null, sheet = '', cls = '' }) {
    return `<div class="scr ${cls}${sheet ? ' has-sheet' : ''}"><div class="scr-bg"></div><div class="scr-body">${body}</div>${tab ? this.tabbar(tab) : ''}${
      sheet ? `<div class="u-scrim"></div>${sheet}` : ''
    }${this.statusbar()}<div class="u-homeind"></div></div>`;
  },
  tabbar(active) {
    const items = [
      ['home', 'Home', 'home'],
      ['readlists', 'Readlists', 'books'],
      ['plus'],
      ['challenges', 'Challenges', 'trophy'],
      ['friends', 'Friends', 'friends'],
    ];
    return `<div class="u-tabbar"><div class="u-tb-in">${items
      .map(([k, l, i]) =>
        k === 'plus'
          ? `<span class="u-tb-plus" aria-label="Create">${ic('plus')}</span>`
          : `<span class="u-tb-it${k === active ? ' is-on' : ''}"><span class="u-tb-ic">${ic(i)}</span><span class="u-tb-l">${l}</span></span>`,
      )
      .join('')}</div></div>`;
  },
  appbar({ back = false, title = '', large = false, actions = [], avatar = false, sub = '' }) {
    const lead = back ? `<span class="u-iconbtn u-back">${ic('chev-l')}<span class="u-back-l">${back === true ? 'Back' : back}</span></span>` : '';
    const trail = actions.map((a) => `<span class="u-iconbtn">${ic(a)}</span>`).join('') + (avatar ? this.avatar(ME, 'ab') : '');
    return `<div class="u-appbar${large ? ' u-appbar--large' : ''}"><div class="u-ab-row"><div class="u-ab-lead">${lead}</div><div class="u-ab-title">${
      large ? '' : title
    }</div><div class="u-ab-trail">${trail}</div></div>${large ? `<h1 class="u-largetitle">${title}</h1>` : ''}${sub ? `<div class="u-ab-sub">${sub}</div>` : ''}</div>`;
  },
  sheet(inner, cls = '') {
    return `<div class="u-sheet ${cls}"><div class="u-grab"></div>${inner}</div>`;
  },

  /* ---------- atoms ---------- */
  avatar(u, size = 'm') {
    if (u.gone) return `<span class="u-av u-av--${size} u-av--gone" aria-hidden="true">${ic('person')}</span>`;
    return `<span class="u-av u-av--${size} av${u.av}" aria-hidden="true">${u.ini}</span>`;
  },
  avatars(keys) {
    return `<span class="u-avs">${keys.map((k) => this.avatar(USERS[k], 's')).join('')}</span>`;
  },
  cover(k, w, h, cls = '') {
    const b = BOOKS[k];
    const [bg, fg, ac, pat] = b.cv;
    const txt = w >= 40 && !cls.includes('notext');
    /* shrink the title so the longest word fits on one line */
    const lw = Math.max(...b.t.split(/\s+/).map((x) => x.length));
    const fs = Math.min(0.135, 0.74 / (lw * 0.58)).toFixed(3);
    return `<span class="cover cv-${pat} ${cls}" style="--w:${w}px;--h:${h}px;--fs:${fs};--cb:${bg};--cf:${fg};--ca:${ac}">${
      txt ? `<span class="cv-t">${esc(b.t)}</span><span class="cv-a">${esc(b.a)}</span>` : ''
    }</span>`;
  },
  mosaic(key, s) {
    return `<span class="u-mosaic" style="--s:${s}px">${READLISTS[key].books
      .slice(0, 4)
      .map((k) => this.cover(k, s / 2, s / 2, 'notext'))
      .join('')}</span>`;
  },
  pill(s, label) {
    return `<span class="u-pill u-pill--${s}">${s === 'read' ? ic('check', 'ic-pill') : ''}${label || STATUS_LABEL[s] || s}</span>`;
  },
  btn(label, o = {}) {
    return `<span class="u-btn u-btn--${o.kind || 'secondary'}${o.size ? ' u-btn--' + o.size : ''}${o.block ? ' u-btn--block' : ''}${
      o.dis ? ' is-dis' : ''
    }">${o.icon ? ic(o.icon) : ''}<span class="u-btn-l">${label}</span>${o.trail ? ic(o.trail) : ''}</span>`;
  },
  flag(label = '') {
    return `<span class="u-flag" title="Part of a challenge">${ic('flag')}${label ? `<span>${label}</span>` : ''}</span>`;
  },
  badge(type) {
    return `<span class="u-badge u-badge--${type}">${CH_LABEL[type]}</span>`;
  },
  stars(v) {
    let out = '';
    for (let i = 1; i <= 5; i++) {
      const k = v >= i ? 'full' : v >= i - 0.5 ? 'half' : 'empty';
      out += `<span class="u-star is-${k}">${ic('star', 'st-bg')}<span class="st-fill">${ic('star', 'st-fg')}</span></span>`;
    }
    return `<span class="u-stars" aria-label="${v} out of 5">${out}</span>`;
  },
  progress(p, label = true) {
    return `<div class="u-prog"><span class="u-bar"><i style="width:${p}%"></i></span>${label ? `<span class="u-prog-l">${p}%</span>` : ''}</div>`;
  },
  ring(n, of) {
    const r = 26, c = 2 * Math.PI * r, f = (n / of) * c;
    return `<span class="u-ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="u-ring-trk" cx="32" cy="32" r="${r}"/><circle class="u-ring-val" cx="32" cy="32" r="${r}" stroke-dasharray="${f.toFixed(1)} ${c.toFixed(1)}"/></svg><span class="u-ring-n"><b>${n}</b><small>of ${of}</small></span></span>`;
  },
  chips(items, on = 0) {
    return `<div class="u-chips">${items.map((t, i) => `<span class="u-chip${i === on ? ' is-on' : ''}">${i === on ? ic('check', 'ic-chip') : ''}${t}</span>`).join('')}</div>`;
  },
  seg(items, on = 0, cls = '') {
    return `<div class="u-seg ${cls}">${items.map((t, i) => `<span class="${i === on ? 'is-on' : ''}">${t}</span>`).join('')}</div>`;
  },
  tabs(items, on = 0) {
    return `<div class="u-tabs">${items.map((t, i) => `<span class="${i === on ? 'is-on' : ''}">${t}</span>`).join('')}</div>`;
  },
  field({ label, value = '', focus = false, adorn = '', help = '', ok = '', icon = '' }) {
    return `<div class="u-field${focus ? ' is-focus' : ''}${value ? ' has-val' : ' is-empty'}"><div class="u-label">${label}</div><div class="u-input">${
      icon ? ic(icon, 'ic-in') : ''
    }<span class="u-val">${esc(value)}</span>${focus ? '<span class="u-caret"></span>' : ''}${adorn ? `<span class="u-adorn">${adorn}</span>` : ''}</div>${
      ok ? `<div class="u-help u-help--ok">${ic('check', 'ic-xs')}${ok}</div>` : ''
    }${help ? `<div class="u-help">${help}</div>` : ''}</div>`;
  },
  sec(title, link = '', cls = '') {
    return `<div class="u-sec ${cls}"><h2 class="u-sec-t">${title}</h2>${link ? `<span class="u-link">${link}</span>` : ''}</div>`;
  },
  list(rows, cls = '') {
    return `<div class="u-list ${cls}">${rows.join('')}</div>`;
  },
  row({ lead = '', t, s = '', trail = '', chev = false, cls = '' }) {
    return `<div class="u-row ${cls}">${lead ? `<div class="u-row-lead">${lead}</div>` : ''}<div class="u-row-main"><div class="u-row-t">${t}</div>${
      s ? `<div class="u-row-s">${s}</div>` : ''
    }</div>${trail ? `<div class="u-row-trail">${trail}</div>` : ''}${chev ? `<span class="u-chev">${ic('chev-r')}</span>` : ''}</div>`;
  },
  /* A row pulled to the left, revealing the other two statuses (B4 swipe). */
  swipe(rowHtml, current = 'want') {
    const acts = { want: ['bookmark', 'Want to read'], reading: ['book', 'Reading'], read: ['check', 'Read'] };
    return `<div class="u-swipe"><div class="u-swipe-acts">${Object.keys(acts)
      .filter((k) => k !== current)
      .map((k) => `<span class="u-sa u-sa--${k}">${ic(acts[k][0])}<span>${acts[k][1]}</span></span>`)
      .join('')}</div><div class="u-swipe-row">${rowHtml}</div></div>`;
  },
  banner() {
    return `<div class="u-banner">${ic('sparkle', 'ic-ban')}<span class="u-banner-t">Lillyjean was updated – <u>see what’s new</u></span><span class="u-iconbtn u-banner-x">${ic('x')}</span></div>`;
  },
  meta(t, cls = '') {
    return `<span class="u-meta ${cls}">${t}</span>`;
  },

  /* ---------- composites ---------- */
  bookTitle(k) {
    const b = BOOKS[k];
    return `${esc(b.t)}${b.flag ? this.flag() : ''}`;
  },
  homeHead() {
    return `<div class="u-homehead"><div class="u-hh-text"><div class="u-greet">Good evening</div><h1 class="u-hello">@${ME.u}</h1></div>${this.avatar(ME, 'ab')}</div>`;
  },
  stats() {
    return `<div class="u-stats"><div class="u-stat u-stat--pledge">${this.ring(20, 24)}<div class="u-stat-txt"><div class="u-stat-t">Books read this year</div>${this.meta(
      '1 ahead of your pledge',
    )}</div></div><div class="u-stat u-stat--chal"><b class="u-stat-n">7</b>${this.meta('challenges completed')}</div></div>`;
  },
  readingCard(k, hint = false) {
    const b = BOOKS[k];
    return `<div class="u-reading">${this.cover(k, 52, 76)}<div class="u-reading-main"><div class="u-row-t">${this.bookTitle(k)}</div><div class="u-row-s">${esc(b.a)}</div>${
      b.p ? this.progress(b.p) : `<div class="u-meta u-nopct">No percentage set</div>`
    }</div>${hint ? `<span class="u-swipehint">${ic('chev-l')}swipe</span>` : ''}</div>`;
  },
  reading(keys) {
    return `<div class="u-readings">${keys.map((k, i) => this.readingCard(k, i === 0)).join('')}</div>`;
  },
  challengeCard(key, o = {}) {
    const c = CHALLENGES[key];
    let mid = '';
    if (o.fits) {
      mid = `<div class="u-chal-pick">${c.pick ? `<span class="u-meta">Your pick: ${esc(BOOKS[c.pick].t)}</span>` : `<span class="u-meta">No book picked yet</span>`}${this.btn('Add this book', {
        kind: c.pick ? 'secondary' : 'primary',
        size: 's',
      })}</div>`;
    } else if (c.pick) {
      mid = `<div class="u-chal-pick">${this.cover(c.pick, 26, 38)}<span class="u-chal-your">Your pick: <b>${esc(BOOKS[c.pick].t)}</b></span>${this.pill(BOOKS[c.pick].s)}</div>`;
    } else if (!c.sub) {
      mid = `<div class="u-chal-pick"><span class="u-meta">No book picked yet</span>${this.btn('Choose a book', { size: 's' })}</div>`;
    }
    const foot = [];
    if (c.friends && !o.fits) foot.push(`<div class="u-chal-friends">${this.avatars(c.friends)}${this.meta(c.done)}</div>`);
    if (c.finished && !o.fits) foot.push(`<div class="u-chal-foot">${this.meta(c.finished)}</div>`);
    if (o.since && c.since) foot.push(`<div class="u-chal-foot">${this.meta(c.since)}</div>`);
    if (c.sub) foot.push(`<div class="u-chal-foot">${this.meta(c.sub)}</div>`);
    return `<div class="u-chal u-chal--${c.type}${o.upcoming ? ' is-upcoming' : ''}"><div class="u-chal-top">${this.badge(c.type)}${this.meta(
      c.when,
      'u-chal-when',
    )}</div><div class="u-chal-t">${esc(c.t)}</div>${mid}${foot.join('')}</div>`;
  },
  rlTile(key, s, sub) {
    const r = READLISTS[key];
    return `<div class="u-rl">${this.mosaic(key, s)}<div class="u-rl-t">${esc(r.t)}</div><div class="u-rl-s">${sub || r.n + ' books'}</div></div>`;
  },

/* The iOS designs share one markup and CSS structure ([data-fam="ios"]); E1 uses a segmented control. */

/* Media dark markup (shelves, fanned readlists, friend activity); reused by Lillyjean. */
const MEDIA_UI = {
  homeHead() {
    return `<div class="md-top"><h1 class="md-logo">lilly<i>jean</i></h1><span class="md-top-r"><span class="u-iconbtn">${ic('search')}</span>${this.avatar(
      ME,
      'ab',
    )}</span></div><div class="md-hello">Good evening, <b>@${ME.u}</b></div>`;
  },
  stats() {
    return `<div class="md-year"><div><div class="md-k">2026 · Books read</div><div class="md-year-n"><b>20</b><span>/ 24</span></div></div><div class="md-year-ch"><b>7</b><span>challenges completed</span></div>${this.progress(
      83,
      false,
    )}${this.meta('1 ahead of your pledge')}</div>`;
  },
  /* a cover shelf with every book you are reading */
  reading(keys) {
    const all = [...keys, ...Object.keys(BOOKS).filter((k) => BOOKS[k].s === 'reading' && !keys.includes(k))];
    return `<div class="md-shelf">${all
      .map((k) => {
        const b = BOOKS[k];
        return `<div class="md-book"><span class="md-cvwrap">${this.cover(k, 112, 166)}${b.flag ? this.flag() : ''}</span><div class="u-row-t">${esc(b.t)}</div>${
          b.p ? this.progress(b.p) : `<div class="u-meta u-nopct">No percentage set</div>`
        }</div>`;
      })
      .join('')}</div>`;
  },
  /* readlists as fanned covers instead of a 2×2 mosaic */
  mosaic(key, s) {
    const cw = Math.round(s * 0.46);
    return `<span class="u-mosaic md-fan" style="--s:${s}px;--cw:${cw}px">${READLISTS[key].books
      .slice(0, 4)
      .map((k) => this.cover(k, cw, Math.round(cw * 1.5), 'notext'))
      .join('')}</span>`;
  },
  /* friend activity: a ring around friends who are reading, plus the cover */
  row(o) {
    const m = o.cls && o.cls.includes('u-row--person') && o.s && o.s.match(/^(Reading|Pick): (.+?)( \(own pick\))?$/);
    const k = m && Object.keys(BOOKS).find((x) => BOOKS[x].t === m[2]);
    if (k) {
      o = {
        ...o,
        lead: m[1] === 'Reading' ? `<span class="md-active">${o.lead}</span>` : o.lead,
        trail: `<span class="md-now">${o.trail || ''}${this.cover(k, 30, 44)}</span>`,
      };
    }
    return UI.row.call(this, o);
  },
};

function sprite() {
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Object.entries(ICONS)
    .map(([k, v]) => `<symbol id="i-${k}" viewBox="0 0 24 24">${v}</symbol>`)
    .join('')}</defs></svg>`;
}

/* =====================================================================
   6. Shell — design switcher, view toggle, notes panel, persistence.
   ===================================================================== */
const STORE_KEY = 'lillyjean-design-prototype-v2';
const DEFAULT_DESIGN = 'lj';
const ACTIVE = DESIGNS.filter((d) => !d.archived);
const ARCHIVED = DESIGNS.filter((d) => d.archived);
/* ids stored or linked by earlier versions of this file; all still exist (ios, m3, ed, sc, pp) */
const LEGACY = { glass: 'ios' };
const HASH_RE = new RegExp(`^#(${[...DESIGNS.map((d) => d.key), ...Object.keys(LEGACY)].join('|')})(?:/([A-Z]\\d+))?`);
const state = { design: DEFAULT_DESIGN, view: 'grid', screen: 'B1', notes: true };
const known = (k) => DESIGNS.some((d) => d.key === (LEGACY[k] || k));

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (s && typeof s === 'object') Object.assign(state, s);
  } catch (e) {
    /* storage blocked (sandboxed iframe, private mode): use defaults */
  }
  const m = location.hash.match(HASH_RE);
  if (m) {
    state.design = LEGACY[m[1]] || m[1];
    if (m[2]) {
      state.screen = m[2];
      state.view = 'one';
    }
  }
  state.design = known(state.design) ? LEGACY[state.design] || state.design : DEFAULT_DESIGN;
  if (!SCREENS.some((s) => s[0] === state.screen)) state.screen = 'B1';
  if (window.matchMedia('(max-width: 640px)').matches && !('notesSet' in state)) state.notes = false;
}
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    /* ignore */
  }
  try {
    history.replaceState(null, '', `#${state.design}${state.view === 'one' ? '/' + state.screen : ''}`);
  } catch (e) {
    /* ignore (sandboxed iframes may block history) */
  }
}

const design = () => DESIGNS.find((d) => d.key === state.design);
function uiFor(d) {
  return Object.assign(Object.create(UI), d.ui);
}

function frame(d, ui, [id, name], grid) {
  const cap = `<b>${id}</b><span>${esc(name)}</span>`;
  return `<figure class="frame" data-sid="${id}"><div class="frame-box"><div class="phone" role="img" aria-label="${id} ${esc(name)}, ${esc(d.name)} design">${SCREEN_RENDER[id](
    ui,
  )}</div></div><figcaption>${
    grid ? `<button type="button" class="cap" data-open="${id}" title="Show ${id} in the One screen view">${cap}</button>` : `<div class="cap">${cap}</div>`
  }</figcaption></figure>`;
}

/* Reads a generated token from the notes panel (the token block also targets [data-notes='lj']). */
function tokenVar(name) {
  return getComputedStyle(document.getElementById('notes')).getPropertyValue(`--${name}`).trim();
}
function tokenTypeLabel(name) {
  const rem = parseFloat(tokenVar(`text-${name}`));
  const lh = parseFloat(tokenVar(`text-${name}--line-height`));
  const ls = tokenVar(`text-${name}--letter-spacing`);
  const px = Math.round(rem * 16);
  return `${px}/${Math.round(px * lh)} · ${tokenVar(`text-${name}--font-weight`)}${ls && ls !== '0' ? `, ${ls.replace('-', '−')}` : ''}`;
}
function renderNotes(d) {
  const swatches = d.tokenSwatches
    ? d.tokenSwatches.map(([n, t]) => [n, `var(--${t})`, `${tokenVar(t).toUpperCase()} · ${t}`])
    : d.swatches.map(([n, h]) => [n, h, h]);
  const sw = swatches.map(([n, bg, code]) => `<li><span class="sw" style="background:${bg}"></span><span class="sw-n">${n}</span><code>${esc(code)}</code></li>`).join('');
  const type = d.tokenType ? d.tokenType.map(([n, t]) => [`${n} <code>text-${t}</code>`, tokenTypeLabel(t)]) : d.type;
  const ty = type.map(([n, v]) => `<li><span>${n}</span><span class="ty-v">${v}</span></li>`).join('');
  const kicker = d.archived
    ? 'Archived · first-round direction, kept for reference'
    : `Design ${ACTIVE.indexOf(d) + 1} of ${ACTIVE.length}${d.chosen ? ' · chosen direction' : ''}`;
  return `<div class="notes-in"><div class="notes-col notes-col--main"><div class="notes-kicker">${kicker}</div><h2>${esc(d.name)}${
    d.archived ? ' <span class="notes-tag">Archived</span>' : d.chosen ? ' <span class="notes-tag notes-tag--chosen">Chosen</span>' : ''
  }</h2><p>${esc(
    d.intent,
  )}</p><p class="notes-build"><b>How we would build it</b> ${esc(d.build)}</p></div><div class="notes-col"><h3>Colour</h3><ul class="swatches">${sw}</ul></div><div class="notes-col"><h3>Type ramp</h3><p class="notes-font">${esc(
    d.font,
  )}</p><ul class="typeramp">${ty}</ul></div></div>`;
}

function render() {
  const d = design();
  const ui = uiFor(d);
  const stage = document.getElementById('stage');
  document.documentElement.dataset.view = state.view;
  stage.dataset.design = d.key;
  stage.dataset.fam = d.fam || d.key;
  document.querySelectorAll('[data-set-design]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setDesign === d.key)));
  document.getElementById('arch-btn').classList.toggle('is-active', !!d.archived);
  document.getElementById('arch-cur').textContent = d.archived ? `· ${d.short}` : '';
  document.querySelectorAll('[data-set-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setView === state.view)));
  const notes = document.getElementById('notes');
  notes.dataset.notes = d.key;
  notes.innerHTML = renderNotes(d);
  notes.hidden = !state.notes;
  document.querySelectorAll('[data-notes-toggle]').forEach((b) => b.setAttribute('aria-pressed', String(state.notes)));
  const sel = document.getElementById('screen-select');
  sel.value = state.screen;
  if (state.view === 'grid') {
    stage.innerHTML = `<div class="grid">${SCREENS.map((s) => frame(d, ui, s, true)).join('')}</div>`;
  } else {
    const s = SCREENS.find((x) => x[0] === state.screen);
    stage.innerHTML = `<div class="single">${frame(d, ui, s)}</div>`;
  }
  fit();
  saveState();
}

/* Scale the frames: fixed in the grid, fit-to-viewport in "One screen". */
function fit() {
  const stage = document.getElementById('stage');
  const narrow = window.innerWidth <= 520;
  document.documentElement.classList.toggle('is-narrow', narrow);
  if (state.view === 'grid') {
    const w = window.innerWidth;
    const s = w < 520 ? (w - 32) / 2 / 413 : w < 900 ? 0.5 : 0.58;
    stage.style.setProperty('--s', s.toFixed(3));
    return;
  }
  const top = document.querySelector('.toolbar').getBoundingClientRect().height + (state.notes ? document.getElementById('notes').getBoundingClientRect().height : 0);
  if (narrow) {
    /* phone: fill the width, the page scrolls for the rest of the screen */
    stage.style.setProperty('--s', (window.innerWidth / 393).toFixed(4));
  } else {
    const availH = Math.max(420, window.innerHeight - top - 84);
    const availW = window.innerWidth - 48;
    stage.style.setProperty('--s', Math.min(1.15, availH / 872, availW / 413).toFixed(3));
  }
}

function step(dir) {
  const i = SCREENS.findIndex((s) => s[0] === state.screen);
  state.screen = SCREENS[(i + dir + SCREENS.length) % SCREENS.length][0];
  render();
}

function init() {
  document.body.insertAdjacentHTML('afterbegin', sprite());
  loadState();
  const designBar = document.getElementById('design-bar');
  designBar.innerHTML = ACTIVE.map(
    (d, i) =>
      `<button type="button" data-set-design="${d.key}" aria-pressed="false" title="${esc(d.name)} (key ${i + 1})"><kbd>${i + 1}</kbd><span class="l-long">${esc(d.short)}</span><span class="l-short">${esc(d.tiny)}</span>${
        d.chosen ? '<span class="tb-chosen" aria-label="chosen direction">★</span>' : ''
      }</button>`,
  ).join('');
  document.getElementById('arch-list').innerHTML = ARCHIVED.map(
    (d) => `<button type="button" data-set-design="${d.key}" aria-pressed="false">${esc(d.name)}</button>`,
  ).join('');
  const archBtn = document.getElementById('arch-btn');
  const archMenu = document.getElementById('arch-menu');
  const setArch = (open) => {
    archMenu.hidden = !open;
    archBtn.setAttribute('aria-expanded', String(open));
  };
  const sel = document.getElementById('screen-select');
  sel.innerHTML = SCREENS.map(([id, n]) => `<option value="${id}">${id} · ${esc(n)}</option>`).join('');

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!e.target.closest('.tb-arch')) setArch(false);
    if (!b) return;
    if (b === archBtn) return setArch(archMenu.hidden);
    if (b.closest('#arch-menu')) setArch(false);
    if (b.dataset.open) {
      state.screen = b.dataset.open;
      state.view = 'one';
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (b.dataset.setDesign) state.design = b.dataset.setDesign;
    else if (b.dataset.setView) state.view = b.dataset.setView;
    else if (b.id === 'prev') return step(-1);
    else if (b.id === 'next') return step(1);
    else if ('notesToggle' in b.dataset) {
      state.notes = !state.notes;
      state.notesSet = true;
    } else return;
    render();
  });
  sel.addEventListener('change', () => {
    state.screen = sel.value;
    render();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.target instanceof Element && e.target.matches('select, input, textarea')) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape' && !archMenu.hidden) {
      setArch(false);
      archBtn.focus();
      return;
    }
    const n = Number(e.key);
    if (n >= 1 && n <= ACTIVE.length) {
      state.design = ACTIVE[n - 1].key;
      render();
    } else if (state.view === 'one' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      step(e.key === 'ArrowRight' ? 1 : -1);
    } else if (e.key === 'g') {
      state.view = state.view === 'grid' ? 'one' : 'grid';
      render();
    }
  });
  window.addEventListener('hashchange', () => {
    loadState();
    render();
  });
  let t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(fit, 80);
  });
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
